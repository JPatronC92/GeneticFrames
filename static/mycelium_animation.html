<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generando Arte Genético...</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        
        #canvas-container {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 255, 150, 0.3);
            margin-bottom: 30px;
        }
        
        .loading-text {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .species-name {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .progress-text {
            font-size: 16px;
            opacity: 0.8;
            text-align: center;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .dna-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 150, 0.6);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) translateX(0px);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            50% { 
                transform: translateY(-20px) translateX(10px);
            }
        }
        
        #result-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background: #0a0a0a;
            z-index: 20;
        }
        
        #generated-art {
            max-width: 90%;
            max-height: 80%;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.4);
        }
        
        .completion-text {
            font-size: 28px;
            font-weight: 300;
            margin-top: 20px;
            text-align: center;
            background: linear-gradient(45deg, #00ff96, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <!-- Partículas de ADN flotantes -->
    <div class="dna-particles" id="particles"></div>
    
    <!-- Container de carga con animación de micelio -->
    <div id="loading-container">
        <div class="species-name" id="species-name">Analizando ADN...</div>
        <div class="loading-text">Crecimiento Genético en Progreso</div>
        <div id="canvas-container"></div>
        <div class="progress-text" id="progress-text">Decodificando secuencias genéticas...</div>
    </div>
    
    <!-- Container para mostrar el resultado final -->
    <div id="result-container">
        <img id="generated-art" src="" alt="Arte Genético Generado" />
        <div class="completion-text">Arte Genético Completado</div>
    </div>

    <script>
        // Configuración de la animación - MUCHO MÁS LENTA Y COMPLEJA
        let animDuration = 25000; // 25 segundos (mucho más lento)
        let points = [];
        let maxPoints = 1200; // Más puntos para mayor complejidad
        let growSpeed = 1.5; // Velocidad más lenta
        let canvas;
        let animationStartTime;
        let progressMessages = [
            "Decodificando secuencias genéticas...",
            "Analizando patrones de ADN...",
            "Calculando firmas genéticas...",
            "Generando identidad simbólica...",
            "Creando arte único...",
            "Aplicando características de especie...",
            "Finalizando obra maestra..."
        ];
        let currentMessageIndex = 0;
        
        function setup() {
            // Crear canvas con tamaño dinámico
            let canvasSize = Math.min(window.innerWidth * 0.6, window.innerHeight * 0.5, 600);
            canvas = createCanvas(canvasSize, canvasSize);
            canvas.parent('canvas-container');
            
            background(5, 10, 15);
            stroke(255);
            strokeWeight(1);
            frameRate(60);
            
            animationStartTime = millis();
            
            // Múltiples puntos iniciales para crecimiento más orgánico
            for (let i = 0; i < 3; i++) {
                points.push({
                    x: width / 2 + random(-50, 50),
                    y: height / 2 + random(-50, 50),
                    angle: random(TWO_PI),
                    generation: 0
                });
            }
            
            // Crear partículas flotantes
            createFloatingParticles();
            
            // Cambiar mensaje de progreso cada 3.5 segundos (mucho más lento)
            setInterval(updateProgressMessage, 3500);
            
            // Obtener nombre de especie de parámetros URL si está disponible
            const urlParams = new URLSearchParams(window.location.search);
            const speciesName = urlParams.get('species');
            if (speciesName) {
                document.getElementById('species-name').textContent = 
                    `Generando arte para: ${decodeURIComponent(speciesName)}`;
            }
        }
        
        function draw() {
            // Efecto de desvanecimiento gradual
            fill(5, 10, 15, 20);
            noStroke();
            rect(0, 0, width, height);
            
            let elapsed = millis() - animationStartTime;
            let progress = elapsed / animDuration;
            
            if (progress < 1 && points.length < maxPoints) {
                growMycelium(progress);
            } else if (elapsed > animDuration) {
                // Animación completada, mostrar resultado
                showResult();
                noLoop();
            }
        }
        
        function growMycelium(progress) {
            let newPoints = [];
            let growthIntensity = 0.5 + progress * 1.5; // Crecimiento más gradual
            
            for (let pt of points) {
                if (random() < 0.4) { // Menor probabilidad de crecimiento para más control
                    let branchCount = random() < 0.3 ? 2 : 1; // Ocasionalmente bifurcar
                    
                    for (let branch = 0; branch < branchCount; branch++) {
                        for (let i = 0; i < growSpeed * growthIntensity; i++) {
                            let angleVariation = map(pt.generation, 0, 15, PI/3, PI/8);
                            let angle = pt.angle + random(-angleVariation, angleVariation);
                            
                            // Añadir movimiento orgánico basado en noise
                            let noiseVal = noise(pt.x * 0.01, pt.y * 0.01, frameCount * 0.01);
                            angle += (noiseVal - 0.5) * 0.5;
                            
                            let stepSize = random(1, 4) * (0.8 + progress * 0.4);
                            let x = pt.x + cos(angle) * stepSize;
                            let y = pt.y + sin(angle) * stepSize;
                            
                            if (x > 20 && x < width - 20 && y > 20 && y < height - 20) {
                                // Sistema de colores más complejo y evolutivo
                                let timeWave = sin(frameCount * 0.02) * 0.5 + 0.5;
                                let depthColor = map(pt.generation, 0, 20, 0, 1);
                                
                                let r = 20 + sin(progress * TWO_PI + pt.generation * 0.2) * 80 + timeWave * 40;
                                let g = 100 + cos(progress * TWO_PI * 1.3 + pt.x * 0.01) * 120 + depthColor * 80;
                                let b = 60 + sin(progress * TWO_PI * 2 + pt.y * 0.01 + frameCount * 0.005) * 180;
                                
                                let alpha = 80 + progress * 175 + sin(pt.generation * 0.3) * 40;
                                
                                stroke(r, g, b, alpha);
                                strokeWeight(0.8 + progress * 2.5 + sin(pt.generation * 0.1) * 0.5);
                                
                                line(pt.x, pt.y, x, y);
                                
                                // Crear nodos especiales con patrones más complejos
                                if (random() < 0.08) {
                                    // Nodos principales brillantes
                                    stroke(255, 255, 255, 150 + sin(frameCount * 0.1) * 100);
                                    strokeWeight(2 + sin(frameCount * 0.05) * 1);
                                    point(x, y);
                                    
                                    // Anillos de energía alrededor de nodos
                                    if (random() < 0.3) {
                                        noFill();
                                        stroke(g, b, r, 100);
                                        strokeWeight(0.5);
                                        circle(x, y, 8 + sin(frameCount * 0.1) * 4);
                                    }
                                }
                                
                                // Crear conexiones inter-ramas ocasionales
                                if (random() < 0.02 && points.length > 50) {
                                    let randomPoint = points[floor(random(points.length))];
                                    let distance = dist(x, y, randomPoint.x, randomPoint.y);
                                    if (distance < 50 && distance > 20) {
                                        stroke(r * 0.7, g * 0.7, b * 0.7, 60);
                                        strokeWeight(0.3);
                                        line(x, y, randomPoint.x, randomPoint.y);
                                    }
                                }
                                
                                newPoints.push({
                                    x: x,
                                    y: y,
                                    angle: angle + random(-0.15, 0.15),
                                    generation: pt.generation + 1,
                                    energy: random(0.5, 1.0),
                                    birthTime: frameCount
                                });
                            }
                        }
                    }
                }
            }
            
            points = [...points, ...newPoints];
            
            // Sistema más sofisticado de limpieza de puntos
            if (points.length > maxPoints) {
                // Mantener puntos más jóvenes y energéticos
                points.sort((a, b) => (b.energy || 0.5) - (a.energy || 0.5));
                points = points.slice(0, maxPoints);
            }
            
            // Añadir efectos de partículas ocasionales
            if (random() < 0.1 && progress > 0.3) {
                addParticleEffect(progress);
            }
        }
        
        function addParticleEffect(progress) {
            if (points.length > 0) {
                let randomPoint = points[floor(random(points.length))];
                for (let i = 0; i < 5; i++) {
                    let angle = random(TWO_PI);
                    let distance = random(10, 30);
                    let px = randomPoint.x + cos(angle) * distance;
                    let py = randomPoint.y + sin(angle) * distance;
                    
                    if (px > 0 && px < width && py > 0 && py < height) {
                        stroke(255, 255, 100 + random(155), 150);
                        strokeWeight(0.5);
                        point(px, py);
                        
                        // Pequeñas líneas radiantes
                        let lineEnd = 3;
                        stroke(255, 255, 200, 100);
                        line(px, py, px + cos(angle) * lineEnd, py + sin(angle) * lineEnd);
                    }
                }
            }
        }
        
        function createFloatingParticles() {
            const particlesContainer = document.getElementById('particles');
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (4 + Math.random() * 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        function updateProgressMessage() {
            const progressElement = document.getElementById('progress-text');
            if (currentMessageIndex < progressMessages.length) {
                progressElement.textContent = progressMessages[currentMessageIndex];
                currentMessageIndex++;
            }
        }
        
        function showResult() {
            // Ocultar animación de carga
            document.getElementById('loading-container').style.display = 'none';
            
            // Mostrar resultado (aquí podrías cargar la imagen generada)
            const resultContainer = document.getElementById('result-container');
            const artImage = document.getElementById('generated-art');
            
            // En una implementación real, aquí cargarías la imagen generada por el backend
            // Por ahora, simularemos con un mensaje
            resultContainer.style.display = 'flex';
            
            // Si hay una imagen específica que cargar, la cargarías aquí
            // artImage.src = '/static/generated_art/latest.png';
            
            setTimeout(() => {
                // Redirigir de vuelta a la aplicación principal después de mostrar el resultado
                window.parent.postMessage({type: 'animation_complete'}, '*');
            }, 3000);
        }
        
        // Escuchar mensajes del parent para controlar la animación
        window.addEventListener('message', function(event) {
            if (event.data.type === 'start_animation') {
                if (event.data.species) {
                    document.getElementById('species-name').textContent = 
                        `Generando arte para: ${event.data.species}`;
                }
                // Reiniciar animación si es necesario
                animationStartTime = millis();
                currentMessageIndex = 0;
                loop();
            }
        });
        
        // Ajustar tamaño de canvas en redimensionamiento
        function windowResized() {
            let canvasSize = Math.min(window.innerWidth * 0.6, window.innerHeight * 0.5, 600);
            resizeCanvas(canvasSize, canvasSize);
        }
    </script>
</body>
</html>
