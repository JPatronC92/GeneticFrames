[project]
name = "geneticframes"
version = "0.2.0"
description = "Deterministic, verifiable DNA-to-SVG art protocol"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.1",
    "biopython>=1.85",
    "eth-account>=0.13.7",
    "ipfshttpclient>=0.7.0",
    "matplotlib>=3.10.3",
    "numpy>=2.3.0",
    "pillow>=11.2.1",
    "plotly>=6.1.2",
    "psycopg2-binary>=2.9.10",
    "requests>=2.32.4",
    "scipy>=1.15.3",
    "spyprot>=0.9.6",
    "sqlalchemy>=2.0.41",
    "streamlit>=1.45.1",
    "trafilatura>=2.0.0",
    "web3>=7.12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
