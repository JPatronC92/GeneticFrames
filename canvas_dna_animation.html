<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Canvas Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a23, #1a1a3a);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        #dnaCanvas {
            display: block;
            margin: 0 auto;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }
        
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
        }
        
        .control-btn {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid rgba(0, 255, 255, 0.5);
            color: cyan;
            padding: 8px 16px;
            margin: 2px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }
        
        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            max-width: 200px;
        }
    </style>
</head>
<body>
    <div class="info-panel" id="infoPanel">
        <div><strong>Análisis Genético Animado</strong></div>
        <div>Nucleótidos: <span id="nucleotideCount">0</span></div>
        <div>GC Content: <span id="gcContent">0%</span></div>
        <div>Entropía: <span id="entropy">0.0</span></div>
        <div>Velocidad: <span id="speed">1x</span></div>
    </div>
    
    <div class="controls">
        <button class="control-btn" onclick="toggleAnimation()">Play/Pause</button>
        <button class="control-btn" onclick="changeSpeed()">Velocidad</button>
        <button class="control-btn" onclick="toggleMode()">Modo</button>
        <button class="control-btn" onclick="resetAnimation()">Reset</button>
    </div>
    
    <canvas id="dnaCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');
        
        // Variables de animación
        let animationId;
        let isPlaying = true;
        let animationSpeed = 1;
        let currentMode = 'orbital';
        let time = 0;
        
        // Datos de secuencia genética (se rellenarán desde Streamlit)
        let sequenceData = "ATCGATCGATCGTAGCTAGCTAGCTA"; // Placeholder
        let nucleotideParticles = [];
        let gcContent = 50;
        let entropy = 2.0;
        
        // Colores para nucleótidos
        const nucleotideColors = {
            'A': '#FF6B6B', // Rojo
            'T': '#4ECDC4', // Turquesa
            'C': '#45B7D1', // Azul
            'G': '#96CEB4'  // Verde
        };
        
        // Inicializar partículas
        function initializeParticles() {
            nucleotideParticles = [];
            
            for (let i = 0; i < sequenceData.length && i < 200; i++) {
                const nucleotide = sequenceData[i];
                if (nucleotide in nucleotideColors) {
                    const particle = {
                        nucleotide: nucleotide,
                        baseX: (i / sequenceData.length) * (canvas.width - 100) + 50,
                        baseY: canvas.height / 2,
                        x: 0,
                        y: 0,
                        size: Math.random() * 6 + 4,
                        phase: Math.random() * Math.PI * 2,
                        orbitRadius: Math.random() * 80 + 40,
                        speed: Math.random() * 0.02 + 0.01,
                        opacity: Math.random() * 0.5 + 0.5,
                        trail: []
                    };
                    nucleotideParticles.push(particle);
                }
            }
            
            updateInfoPanel();
        }
        
        // Actualizar panel de información
        function updateInfoPanel() {
            document.getElementById('nucleotideCount').textContent = sequenceData.length;
            document.getElementById('gcContent').textContent = gcContent + '%';
            document.getElementById('entropy').textContent = entropy.toFixed(2);
            document.getElementById('speed').textContent = animationSpeed + 'x';
        }
        
        // Modo orbital - partículas girando en órbitas
        function drawOrbitalMode() {
            nucleotideParticles.forEach(particle => {
                // Calcular posición orbital
                const orbitX = particle.baseX + Math.cos(time * particle.speed + particle.phase) * particle.orbitRadius;
                const orbitY = particle.baseY + Math.sin(time * particle.speed + particle.phase) * (particle.orbitRadius * 0.5);
                
                particle.x = orbitX;
                particle.y = orbitY;
                
                // Agregar a la estela
                particle.trail.push({x: particle.x, y: particle.y, opacity: particle.opacity});
                if (particle.trail.length > 20) {
                    particle.trail.shift();
                }
                
                // Dibujar estela
                particle.trail.forEach((point, index) => {
                    const trailOpacity = (index / particle.trail.length) * point.opacity * 0.3;
                    ctx.globalAlpha = trailOpacity;
                    ctx.fillStyle = nucleotideColors[particle.nucleotide];
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, particle.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Dibujar partícula principal
                ctx.globalAlpha = particle.opacity + 0.3 * Math.sin(time * 0.1 + particle.phase);
                ctx.fillStyle = nucleotideColors[particle.nucleotide];
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Brillo exterior
                ctx.globalAlpha = 0.2;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size * 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // Modo espiral - partículas formando doble hélice
        function drawSpiralMode() {
            nucleotideParticles.forEach((particle, index) => {
                const progress = (index / nucleotideParticles.length) * Math.PI * 8;
                const helixRadius = 100;
                const centerX = canvas.width / 2;
                const centerY = 50 + (index / nucleotideParticles.length) * (canvas.height - 100);
                
                // Determinar cadena (A-T, C-G)
                const isMainChain = particle.nucleotide === 'A' || particle.nucleotide === 'C';
                const chainOffset = isMainChain ? 0 : Math.PI;
                
                particle.x = centerX + Math.cos(progress + time * 0.02 + chainOffset) * helixRadius;
                particle.y = centerY;
                
                // Dibujar partícula
                ctx.globalAlpha = particle.opacity + 0.3 * Math.sin(time * 0.1 + index * 0.1);
                ctx.fillStyle = nucleotideColors[particle.nucleotide];
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Conexiones entre pares de bases
                if (!isMainChain && index > 0) {
                    const prevParticle = nucleotideParticles[index - 1];
                    if (prevParticle && (
                        (particle.nucleotide === 'T' && prevParticle.nucleotide === 'A') ||
                        (particle.nucleotide === 'G' && prevParticle.nucleotide === 'C')
                    )) {
                        ctx.globalAlpha = 0.3;
                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(prevParticle.x, prevParticle.y);
                        ctx.lineTo(particle.x, particle.y);
                        ctx.stroke();
                    }
                }
            });
        }
        
        // Modo ondular - partículas siguiendo ondas
        function drawWaveMode() {
            nucleotideParticles.forEach((particle, index) => {
                const waveAmplitude = 150;
                const frequency = 0.02;
                const phaseShift = index * 0.2;
                
                particle.x = particle.baseX;
                particle.y = canvas.height / 2 + Math.sin(time * frequency + phaseShift) * waveAmplitude;
                
                // Dibujar partícula con efecto de onda
                const waveInfluence = Math.abs(Math.sin(time * frequency + phaseShift));
                ctx.globalAlpha = particle.opacity * (0.5 + waveInfluence * 0.5);
                ctx.fillStyle = nucleotideColors[particle.nucleotide];
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size * (1 + waveInfluence * 0.5), 0, Math.PI * 2);
                ctx.fill();
                
                // Líneas de conexión ondulares
                if (index > 0) {
                    const prevParticle = nucleotideParticles[index - 1];
                    ctx.globalAlpha = 0.2;
                    ctx.strokeStyle = nucleotideColors[particle.nucleotide];
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(prevParticle.x, prevParticle.y);
                    ctx.lineTo(particle.x, particle.y);
                    ctx.stroke();
                }
            });
        }
        
        // Función principal de animación
        function animate() {
            if (!isPlaying) return;
            
            // Limpiar canvas
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(10, 10, 35, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar según el modo actual
            switch (currentMode) {
                case 'orbital':
                    drawOrbitalMode();
                    break;
                case 'spiral':
                    drawSpiralMode();
                    break;
                case 'wave':
                    drawWaveMode();
                    break;
            }
            
            // Incrementar tiempo
            time += animationSpeed;
            
            // Continuar animación
            animationId = requestAnimationFrame(animate);
        }
        
        // Controles de animación
        function toggleAnimation() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                animate();
            } else {
                cancelAnimationFrame(animationId);
            }
        }
        
        function changeSpeed() {
            animationSpeed = animationSpeed >= 3 ? 0.5 : animationSpeed + 0.5;
            updateInfoPanel();
        }
        
        function toggleMode() {
            const modes = ['orbital', 'spiral', 'wave'];
            const currentIndex = modes.indexOf(currentMode);
            currentMode = modes[(currentIndex + 1) % modes.length];
        }
        
        function resetAnimation() {
            time = 0;
            initializeParticles();
        }
        
        // Función para recibir datos desde Streamlit
        function updateSequenceData(sequence, gc, ent) {
            sequenceData = sequence;
            gcContent = gc;
            entropy = ent;
            initializeParticles();
        }
        
        // Inicializar animación
        initializeParticles();
        animate();
        
        // Exponer función globalmente para Streamlit
        window.updateSequenceData = updateSequenceData;
    </script>
</body>
</html>
